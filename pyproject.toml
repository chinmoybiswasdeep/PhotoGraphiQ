[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "photographiq"
version = "0.3.0"
description = "Continuous-variable photonic measurement-based quantum computing"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{name = "PhotoGraphiQ contributors"}]
keywords = ["quantum computing", "photonics", "continuous variables", "MBQC"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Physics", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]
dependencies = ["numpy>=1.26", "scipy>=1.12", "networkx>=3.2", "piquasso==8.0.1"]

[project.optional-dependencies]
visualization = ["matplotlib>=3.8"]
validation = ["graphix==0.4"]
autodiff = ["jax>=0.4.35"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10", "mkdocstrings[python]>=0.27", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "build>=1.2", "matplotlib>=3.8", "graphix==0.4"]

[project.urls]
Repository = "https://github.com/chinmoybiswasdeep/PhotoGraphiQ"
Documentation = "https://chinmoybiswasdeep.github.io/PhotoGraphiQ/"
Issues = "https://github.com/chinmoybiswasdeep/PhotoGraphiQ/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/photographiq"]

[tool.hatch.build.targets.sdist]
exclude = ["/papers", "/.research", "/.venv", "/paper/results/coverage.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/photographiq"]
