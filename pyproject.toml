[build-system]
# scikit-build-core compiles the optional C++20 engines in cpp/ into photographiq._native.
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "photographiq"
version = "0.3.1"
description = "Continuous-variable photonic measurement-based quantum computing, with the PhotoGraphiQML learning layer"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{name = "PhotoGraphiQ contributors"}]
keywords = ["quantum computing", "photonics", "continuous variables", "MBQC", "quantum machine learning"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Physics", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]
dependencies = ["numpy>=1.26", "scipy>=1.12", "networkx>=3.2"]

[project.optional-dependencies]
# Reference simulator for the piquasso* backends and cross-checks; not needed by the core.
# numba<0.68: with numba 0.68.1 / llvmlite 0.50.0, Piquasso's cached hafnian kernels crash on
# reload ("LLVM ERROR: Symbol not found: .numba.unresolved$...hessenberg._calc_vH_times_AB"):
# the first process compiles and caches, every later process aborts. Reproduced on Windows
# and the cause of the 2026-11-12 Linux docs-CI failure; numba 0.67.0 / llvmlite 0.49.0 pass.
# See docs/validation/PHASE1_RELEASE_AUDIT.md. Remove once a fixed numba is verified.
piquasso = ["piquasso==8.0.1", "numba<0.68"]
# Multiprecision threshold (torontonian) probabilities: threshold_probability(precision=...).
precision = ["mpmath>=1.3"]
# Optional GPU module photographiq.gpu (CuPy; pick the wheel matching the CUDA driver).
gpu-cuda12 = ["cupy-cuda12x>=13"]
gpu-cuda13 = ["cupy-cuda13x[ctk]>=13"]
visualization = ["matplotlib>=3.8"]
validation = ["graphix==0.4"]
# PhotoGraphiQML extras (namespaced so they do not change the meaning of `validation`).
ml-validation = ["mentpy==0.1.0a15"]
ml-experiments = ["matplotlib>=3.8", "scikit-learn>=1.3", "piquasso==8.0.1", "numba<0.68"]
# Piquasso prepares every input/Prepare state (MixedFockBackend) before the JAX evolution.
autodiff = ["jax>=0.4.35", "piquasso==8.0.1", "numba<0.68"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10", "mkdocstrings[python]>=0.27", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "build>=1.2", "matplotlib>=3.8", "graphix==0.4", "nbformat>=5", "piquasso==8.0.1", "numba<0.68", "mpmath>=1.3"]

[project.urls]
Repository = "https://github.com/chinmoybiswasdeep/PhotoGraphiQ"
Documentation = "https://chinmoybiswasdeep.github.io/PhotoGraphiQ/"
Issues = "https://github.com/chinmoybiswasdeep/PhotoGraphiQ/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
cmake.source-dir = "cpp"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
# One distribution ships both import packages; photographiqml depends on photographiq only.
wheel.packages = ["src/photographiq", "src/photographiqml"]
sdist.exclude = ["/papers", "/.research", "/.venv", "/build", "/paper/results/coverage.json", "/.vscode", "/*.png"]

[tool.scikit-build.cmake.define]
PGQ_COMPONENTS = "gaussian;fock;sampling"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No pythonpath = ["src"]: tests import the INSTALLED package (editable or wheel). Putting src
# first shadowed regular installs, whose compiled photographiq._native is not in src.
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/photographiq", "src/photographiqml"]
