[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "photographiq"
version = "0.2.0"
description = "Continuous-variable photonic measurement-based quantum computing"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.12", "networkx>=3.2", "piquasso==8.0.1"]

[project.optional-dependencies]
visualization = ["matplotlib>=3.8"]
validation = ["graphix==0.4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "build>=1.2", "matplotlib>=3.8", "graphix==0.4"]

[project.urls]
Repository = "https://github.com/chinmoybiswasdeep/PhotoGraphiQ"

[tool.hatch.build.targets.wheel]
packages = ["src/photographiq"]

[tool.hatch.build.targets.sdist]
exclude = ["/papers", "/.research", "/.venv", "/paper/results/coverage.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/photographiq"]
