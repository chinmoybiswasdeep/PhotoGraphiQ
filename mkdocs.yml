site_name: PhotoGraphiQ
site_description: Continuous-variable photonic measurement-based quantum computing
site_url: https://chinmoybiswasdeep.github.io/PhotoGraphiQ/
repo_url: https://github.com/chinmoybiswasdeep/PhotoGraphiQ
edit_uri: edit/main/docs/
theme:
  name: material
  logo: assets/logo.svg
  palette:
    primary: teal
    accent: deep orange
  features: [navigation.tabs, navigation.sections, navigation.top, content.code.copy, search.suggest]
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            members_order: source
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
nav:
