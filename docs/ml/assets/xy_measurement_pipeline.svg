<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-labelledby="title desc">
  <title id="title">Round structure of the physical GKP logical XY measurement</title>
  <desc id="desc">The data mode is entangled with a fresh magic ancilla by a logical CNOT (Gaussian SUM). The ancilla q homodyne is decoded to a bit m. m = 0 completes the rotation; m = 1 doubles the remaining angle and starts another round, up to K rounds, after which the record is a heralded failure. A Clifford remainder is finished with a shear, a Y-state ancilla or a frame flip. Finally the data p quadrature is measured, decoded and XORed with the frame flip to give the logical bit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .mode { stroke: #1f4e79; stroke-width: 2.5; fill: none; }
      .classical { stroke: #555; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
      .box { fill: #eef4fb; stroke: #1f4e79; stroke-width: 1.5; }
      .meter { fill: #fff6e5; stroke: #a8650a; stroke-width: 1.5; }
      .decide { fill: #f3f3f3; stroke: #555; stroke-width: 1.5; }
      .ok { fill: #e9f6ec; stroke: #2e7d32; stroke-width: 1.5; }
      .fail { fill: #fdecea; stroke: #b3261e; stroke-width: 1.5; }
      .label { fill: #222; }
      .small { fill: #444; font-size: 11.5px; }
      .title { fill: #111; font-size: 15px; font-weight: bold; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="8" fill="#ffffff"/>
  <text x="20" y="28" class="title">Measuring M_L(a) = cos(a) X_L + sin(a) Y_L: apply D(-a), then read out X_L</text>
  <text x="20" y="48" class="small">phi = phase still to apply to the data mode; it starts at phi = -a. Round k = 1, ..., K (K = max_rounds, default 4).</text>

  <!-- data mode -->
  <text x="20" y="104" class="label">data mode</text>
  <text x="20" y="120" class="small">GKP |psi_L&gt;</text>
  <line x1="100" y1="110" x2="770" y2="110" class="mode"/>

  <!-- ancilla -->
  <text x="20" y="214" class="label">magic ancilla</text>
  <text x="20" y="230" class="small">fresh mode per round</text>
  <rect x="140" y="195" width="160" height="40" rx="5" class="box"/>
  <text x="220" y="212" text-anchor="middle" class="label">prepare finite</text>
  <text x="220" y="228" text-anchor="middle" class="label">|0~&gt; + e^(i phi) |1~&gt;</text>
  <line x1="300" y1="215" x2="400" y2="215" class="mode"/>

  <!-- CNOT / SUM -->
  <circle cx="340" cy="110" r="6" fill="#1f4e79"/>
  <line x1="340" y1="110" x2="340" y2="215" stroke="#1f4e79" stroke-width="2"/>
  <circle cx="340" cy="215" r="11" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <line x1="329" y1="215" x2="351" y2="215" stroke="#1f4e79" stroke-width="2"/>
  <line x1="340" y1="204" x2="340" y2="226" stroke="#1f4e79" stroke-width="2"/>
  <text x="352" y="160" class="small">logical CNOT</text>
  <text x="352" y="174" class="small">(Gaussian SUM)</text>

  <!-- ancilla q homodyne -->
  <rect x="400" y="195" width="90" height="40" rx="5" class="meter"/>
  <text x="445" y="212" text-anchor="middle" class="label">q homodyne</text>
  <text x="445" y="228" text-anchor="middle" class="small">record q_k</text>

  <!-- decode -->
  <line x1="490" y1="215" x2="530" y2="215" class="classical" marker-end="url(#arrow)"/>
  <rect x="530" y="195" width="120" height="40" rx="5" class="decide"/>
  <text x="590" y="212" text-anchor="middle" class="label">nearest-cell</text>
  <text x="590" y="228" text-anchor="middle" class="label">parity m_k</text>

  <!-- outcomes -->
  <line x1="560" y1="235" x2="470" y2="285" class="classical" marker-end="url(#arrow)"/>
  <line x1="620" y1="235" x2="700" y2="285" class="classical" marker-end="url(#arrow)"/>
  <rect x="330" y="285" width="230" height="44" rx="5" class="ok"/>
  <text x="445" y="303" text-anchor="middle" class="label">m = 0: D(phi) applied</text>
  <text x="445" y="320" text-anchor="middle" class="small">phi := 0, rotation complete</text>
  <rect x="600" y="285" width="230" height="44" rx="5" class="decide"/>
  <text x="715" y="303" text-anchor="middle" class="label">m = 1: D(-phi) applied</text>
  <text x="715" y="320" text-anchor="middle" class="small">phi := 2 phi (angle doubling)</text>

  <!-- loop back -->
  <path d="M 715 329 L 715 365 L 220 365 L 220 237" class="classical" marker-end="url(#arrow)"/>
  <text x="240" y="358" class="small">next round if phi is not k pi/2 and fewer than K rounds were used</text>

  <!-- failure -->
  <line x1="830" y1="307" x2="850" y2="307" class="classical"/>
  <path d="M 850 307 L 850 385" class="classical" marker-end="url(#arrow)"/>
  <rect x="640" y="385" width="300" height="44" rx="5" class="fail"/>
  <text x="790" y="403" text-anchor="middle" class="label">K rounds used, phi still non-Clifford:</text>
  <text x="790" y="420" text-anchor="middle" class="small">heralded failure (heralded_success = False)</text>

  <!-- Clifford remainder on the data mode -->
  <rect x="520" y="85" width="190" height="50" rx="5" class="box"/>
  <text x="615" y="104" text-anchor="middle" class="label">Clifford remainder</text>
  <text x="615" y="120" text-anchor="middle" class="small">S / S^dagger shear, Y-state ancilla,</text>
  <text x="615" y="132" text-anchor="middle" class="small">or Z = outcome flip</text>

  <!-- final p homodyne -->
  <rect x="770" y="90" width="90" height="40" rx="5" class="meter"/>
  <text x="815" y="107" text-anchor="middle" class="label">p homodyne</text>
  <text x="815" y="123" text-anchor="middle" class="small">record p</text>
  <line x1="815" y1="130" x2="815" y2="160" class="classical" marker-end="url(#arrow)"/>
  <rect x="730" y="160" width="210" height="58" rx="5" class="ok"/>
  <text x="835" y="178" text-anchor="middle" class="label">decode parity, XOR frame flip</text>
  <text x="835" y="195" text-anchor="middle" class="label">logical bit (0 = +1)</text>
  <text x="835" y="210" text-anchor="middle" class="small">+ readout_probabilities</text>

  <!-- legend -->
  <line x1="20" y1="395" x2="60" y2="395" class="mode"/>
  <text x="68" y="399" class="small">oscillator mode</text>
  <line x1="20" y1="417" x2="60" y2="417" class="classical"/>
  <text x="68" y="421" class="small">classical bit (feed-forward uses decoded bits only)</text>
</svg>
