name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Include optional differentiation in the coverage environment
        if: matrix.python == '3.12'
        run: python -m pip install -e '.[autodiff]'
      - name: Test, lint, format, type-check and build (all gates)
        run: python experiments/validate_release.py --output .validation
      - name: Enforce measured coverage floor
        if: matrix.python == '3.12'
        run: python -m coverage report --data-file=.validation/.coverage --fail-under=90
      - name: Upload validation logs and exact environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .validation/*.json
            .validation/*.xml
            .validation/*.log
            .validation/dist/*
      - name: Upload measured coverage
        if: always() && matrix.python == '3.12' && hashFiles('.validation/coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          files: .validation/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
