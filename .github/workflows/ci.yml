name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --cov=photographiq
      - run: python -m ruff check src tests examples experiments
      - run: python -m ruff format --check src tests examples experiments
      - run: python -m mypy src/photographiq
        if: matrix.python == '3.12'
      - run: python -m build
