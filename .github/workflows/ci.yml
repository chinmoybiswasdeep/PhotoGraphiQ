name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Test, lint, format, type-check and build (all gates)
        run: python experiments/validate_release.py --output .validation
      - name: Upload validation logs and exact environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .validation/*.json
            .validation/*.xml
            .validation/*.log
            .validation/dist/*
