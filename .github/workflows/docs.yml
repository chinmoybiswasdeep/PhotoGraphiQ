name: documentation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,docs,autodiff]'
      - run: python scripts/check_public_api.py
      - run: python -m pytest tests/autodiff tests/mixed_fock tests/compilation tests/gkp tests/integration/test_visualization.py
      - run: python scripts/check_docs_examples.py --projects --notebooks
      - run: python -m mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site/
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
